name: CI / CD – Surya Women's Health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: surya-womens-health

# ─────────────────────────────────────────────────────────────
# Job 1 – Lint & Type-check
# ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

# ─────────────────────────────────────────────────────────────
# Job 2 – Unit & Integration Tests + Coverage
# ─────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surya_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/surya_test
      NEXTAUTH_SECRET: test-secret-ci
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run Unit Tests
        run: npm run test:unit -- --coverage --coverageDirectory=coverage

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

# ─────────────────────────────────────────────────────────────
# Job 3 – E2E Tests (Playwright) – only on push to main
# ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/surya_e2e
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/surya_e2e
      NEXTAUTH_SECRET: test-secret-ci
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surya_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client & migrate
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Build Next.js
        run: npm run build

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

# ─────────────────────────────────────────────────────────────
# Job 4 – Docker Build & Push to Docker Hub
# ─────────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# ─────────────────────────────────────────────────────────────
# Job 5 – CD: Deploy to Render (after Docker image pushed)
# ─────────────────────────────────────────────────────────────
  deploy:
    name: "CD – Deploy to Render"
    needs: [docker, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.health.outputs.live_url }}

    steps:
      # ── Step 1: Trigger a new deploy via Render API ────────
      - name: Trigger Render deployment
        id: trigger
        run: |
          echo "🚀 Triggering deploy for service ${{ secrets.RENDER_SERVICE_ID }}..."
          RESPONSE=$(curl -sS -w "\n%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | jq '.' 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Render API returned HTTP $HTTP_CODE"
            # Fallback: try deploy hook URL
            echo "⚠️  Falling back to deploy hook..."
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || true
            echo "DEPLOY_ID=hook" >> "$GITHUB_OUTPUT"
          else
            DEPLOY_ID=$(echo "$BODY" | jq -r '.id // .deploy.id // "unknown"')
            echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
            echo "✅ Deploy created: $DEPLOY_ID"
          fi

      # ── Step 2: Poll Render until deploy is live or failed ─
      - name: Wait for deployment to finish
        id: poll
        timeout-minutes: 10
        run: |
          DEPLOY_ID="${{ steps.trigger.outputs.DEPLOY_ID }}"
          SERVICE_ID="${{ secrets.RENDER_SERVICE_ID }}"
          API_KEY="${{ secrets.RENDER_API_KEY }}"

          if [ "$DEPLOY_ID" = "hook" ] || [ "$DEPLOY_ID" = "unknown" ]; then
            echo "⏳ Using deploy hook — waiting 120s for Render to rebuild..."
            sleep 120
            echo "STATUS=assumed_live" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "⏳ Polling deploy $DEPLOY_ID status..."
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            STATUS_RESPONSE=$(curl -sS \
              -H "Authorization: Bearer $API_KEY" \
              "https://api.render.com/v1/services/$SERVICE_ID/deploys/$DEPLOY_ID")

            STATUS=$(echo "$STATUS_RESPONSE" | jq -r '.status // .deploy.status // "unknown"')
            echo "  [$ATTEMPT/$MAX_ATTEMPTS] Status: $STATUS"

            case "$STATUS" in
              live)
                echo "✅ Deployment is LIVE!"
                echo "STATUS=live" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              deactivated|canceled|build_failed|update_failed)
                echo "::error::Deployment FAILED with status: $STATUS"
                echo "$STATUS_RESPONSE" | jq '.' 2>/dev/null
                echo "STATUS=failed" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
              *)
                # Still building/deploying — wait and retry
                sleep 10
                ;;
            esac
          done

          echo "::error::Deployment timed out after $MAX_ATTEMPTS attempts"
          echo "STATUS=timeout" >> "$GITHUB_OUTPUT"
          exit 1

      # ── Step 3: Run Prisma migrations on production DB ─────
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies (for Prisma CLI)
        run: npm ci --ignore-scripts

      - name: Run production Prisma migrations
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
        run: |
          npx prisma generate
          echo "🗄️  Running migrations on production database..."
          npx prisma migrate deploy
          echo "✅ Migrations applied"

      # ── Step 4: Health check on the live app ───────────────
      - name: Health check
        id: health
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://${{ secrets.RENDER_SERVICE_NAME }}.onrender.com"
          fi
          echo "live_url=$RENDER_URL" >> "$GITHUB_OUTPUT"

          echo "🏥 Running health check on $RENDER_URL ..."
          MAX_RETRIES=5
          RETRY=0

          while [ $RETRY -lt $MAX_RETRIES ]; do
            RETRY=$((RETRY + 1))
            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 30 "$RENDER_URL" || echo "000")

            echo "  [$RETRY/$MAX_RETRIES] HTTP $HTTP_STATUS"

            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
              echo "✅ Health check PASSED (HTTP $HTTP_STATUS)"
              exit 0
            fi

            if [ $RETRY -lt $MAX_RETRIES ]; then
              echo "  Retrying in 15s..."
              sleep 15
            fi
          done

          echo "::warning::Health check got HTTP $HTTP_STATUS — the app may still be starting (Render free tier cold-start)"

      # ── Step 5: Deployment summary ─────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Deploy ID** | \`${{ steps.trigger.outputs.DEPLOY_ID }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Status** | \`${{ steps.poll.outputs.STATUS }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **URL** | ${{ steps.health.outputs.live_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Docker Tag** | \`${{ secrets.DOCKERHUB_USERNAME }}/surya-womens-health:sha-${GITHUB_SHA::7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | @${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
